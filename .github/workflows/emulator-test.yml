name: Emulator VPN E2E Tests

on:
  push:
    branches: [master]
    # 纯文档推送不会改变任何被测行为，省掉一次约 7 分钟的全量模拟器跑。
    # PR 不加过滤：PR 该做完整验证。手动触发（workflow_dispatch）也不受此过滤影响。
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  emulator-test:
    name: Android Emulator VPN E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 66

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then
            SM=$(find "$SDK" -path '*/cmdline-tools/*/bin/sdkmanager' | sort | tail -1)
          fi
          test -n "$SM" && test -x "$SM"
          yes | "$SM" --licenses >/dev/null || true
          NDK_PKG=$("$SM" --list 2>/dev/null | awk '/^[[:space:]]*ndk;/{print $1}' | sort -V | tail -1)
          echo "Installing $NDK_PKG"
          test -n "$NDK_PKG"
          "$SM" --install "$NDK_PKG"
          VER="${NDK_PKG#ndk;}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$VER" >> "$GITHUB_ENV"

      - name: Build native libraries
        env:
          # 模拟器是 x86_64，只编这一套以缩短流水线时间
          PINGTUNNEL_ABIS: arm64-v8a
          HEV_ABIS: arm64-v8a
        run: bash scripts/build_native.sh

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: PUSH FILES TO SERVER
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SERVER_PRIVATE_KEY }}" > ~/.ssh/srvssh
          chmod 600 ~/.ssh/srvssh
          scp -i ~/.ssh/srvssh -r ~/work hf@47.95.110.190:/home/Shm
